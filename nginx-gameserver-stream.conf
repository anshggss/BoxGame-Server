# =============================================================================
# HOST-LEVEL NGINX STREAM CONFIG – game-server TLS proxy
# =============================================================================
# Purpose
# -------
# Game-server pods use hostNetwork and listen on ports 30000–31000 on the VM's
# host network. The client is served from Vercel (HTTPS), so it must connect
# via wss:// (TLS). Plain ws:// is blocked by browsers as mixed content.
#
# This Nginx stream block terminates TLS for server.boxgame.shadyggs.xyz and
# forwards each connection to the same port on 127.0.0.1, where the game-server
# pod is already listening (hostNetwork means the pod port IS the VM port).
#
# Deployment steps
# ----------------
# 1. Install nginx on the VM (NOT inside k8s – this runs on the host):
#        sudo apt install nginx
#
# 2. Obtain a TLS cert for server.boxgame.shadyggs.xyz.
#    If cert-manager issued one for gateway.boxgame.shadyggs.xyz you can reuse
#    the same VM cert, or get a wildcard cert for *.boxgame.shadyggs.xyz.
#    Recommended: use certbot standalone for this domain:
#        sudo certbot certonly --standalone -d server.boxgame.shadyggs.xyz
#    Cert will land at:
#        /etc/letsencrypt/live/server.boxgame.shadyggs.xyz/fullchain.pem
#        /etc/letsencrypt/live/server.boxgame.shadyggs.xyz/privkey.pem
#
# 3. Enable the stream module. In /etc/nginx/nginx.conf add at the top level
#    (outside the http {} block):
#        stream {
#            include /etc/nginx/stream.d/*.conf;
#        }
#
# 4. Copy this file:
#        sudo mkdir -p /etc/nginx/stream.d
#        sudo cp nginx-gameserver-stream.conf /etc/nginx/stream.d/gameserver-tls.conf
#
# 5. Test and reload:
#        sudo nginx -t && sudo systemctl reload nginx
#
# 6. Open the port range in the firewall:
#        sudo ufw allow 30000:31000/tcp
#        sudo ufw allow 443/tcp   # for gateway Ingress
#        sudo ufw allow 80/tcp    # for Let's Encrypt HTTP-01 challenge
# =============================================================================

# ── TLS context shared by all server blocks in this file ────────────────
# NOTE: This file is included INSIDE the stream {} block in nginx.conf.
#       Do NOT wrap this in another stream {} block.
ssl_certificate     /etc/letsencrypt/live/server.boxgame.shadyggs.xyz/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/server.boxgame.shadyggs.xyz/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         HIGH:!aNULL:!MD5;
ssl_session_cache   shared:SSL_stream:10m;
ssl_session_timeout 10m;

# ── Per-port server blocks (generated by scripts/gen-stream-ports.sh) ───────
# Each game-server pod listens on a port in [30000, 31000] via hostNetwork.
# Nginx terminates TLS and proxies straight through to 127.0.0.1:<port>.
#
# Re-generate after changing the port range:
#   sudo bash scripts/gen-stream-ports.sh
#   sudo nginx -t && sudo systemctl reload nginx
#
# The include path must match stream-conf.d/ (what nginx.conf loads):
include /etc/nginx/stream-conf.d/gameserver-ports.conf;
