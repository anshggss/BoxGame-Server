# =============================================================================
# HOST-LEVEL NGINX STREAM CONFIG – game-server TLS proxy
# =============================================================================
# Purpose
# -------
# Game-server pods use hostNetwork and listen on INTERNAL ports 30000–31000
# on the VM. The client is served from Vercel (HTTPS) and must connect via
# wss:// (TLS). Plain ws:// is blocked by browsers as mixed content.
#
# This config terminates TLS for server.boxgame.shadyggs.xyz on EXTERNAL ports
# 20000–21000 and forwards each plaintext connection to the same-offset INTERNAL
# port on 127.0.0.1.
#
# Port design – TWO distinct ranges (IMPORTANT – do not collapse back to one)
# ---------------------------------------------------------------------------
#   EXTERNAL (TLS, clients connect here):  20000–21000
#   INTERNAL (plaintext, pods listen here): 30000–31000
#   OFFSET: 10000  →  nginx listens on EXT_PORT, proxies to EXT_PORT + 10000
#
#   Example: wss://server.boxgame.shadyggs.xyz:20426
#            → nginx :20426 (TLS terminated)
#            → 127.0.0.1:30426 (game-server pod, hostNetwork, plaintext)
#
#   WHY TWO RANGES: If nginx binds 0.0.0.0:N and proxy_pass 127.0.0.1:N,
#   nginx owns loopback too. The connection loops back into nginx's own TLS
#   listener, producing repeated SSL_do_handshake() errors in error.log:
#     SSL: error:1408F09C:SSL routines:ssl3_get_record:http request
#   Distinct ranges guarantee proxy_pass always hits the real pod.
#
# Deployment steps
# ----------------
# 1. Install nginx on the VM (NOT inside k8s – this runs on the host):
#        sudo dnf install nginx   # Oracle Linux / RHEL
#
# 2. Obtain a TLS cert for server.boxgame.shadyggs.xyz:
#        sudo certbot certonly --standalone -d server.boxgame.shadyggs.xyz
#    Cert lands at:
#        /etc/letsencrypt/live/server.boxgame.shadyggs.xyz/fullchain.pem
#        /etc/letsencrypt/live/server.boxgame.shadyggs.xyz/privkey.pem
#
# 3. Ensure nginx.conf has at the top level (outside http {}):
#        stream {
#            include /etc/nginx/stream-conf.d/*.conf;
#        }
#
# 4. Deploy this file and generate port blocks:
#        sudo mkdir -p /etc/nginx/stream-conf.d
#        sudo cp nginx-gameserver-stream.conf /etc/nginx/stream-conf.d/gameserver-tls.conf
#        sudo bash scripts/gen-stream-ports.sh
#
# 5. Test and reload:
#        sudo nginx -t && sudo systemctl reload nginx
#
# 6. Open the EXTERNAL port range in firewalls (NOT the internal 30000-31000):
#        OCI Security List: TCP 20000-21000 ingress from 0.0.0.0/0
#        OS iptables: sudo iptables -I INPUT -p tcp --dport 20000:21000 -j ACCEPT
#        (80/tcp and 443/tcp already open for gateway Ingress + Let's Encrypt)
# =============================================================================

# ── TLS context shared by all server blocks in this file ────────────────
# NOTE: This file is included INSIDE the stream {} block in nginx.conf.
#       Do NOT wrap this in another stream {} block.
ssl_certificate     /etc/letsencrypt/live/server.boxgame.shadyggs.xyz/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/server.boxgame.shadyggs.xyz/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         HIGH:!aNULL:!MD5;
ssl_session_cache   shared:SSL_stream:10m;
ssl_session_timeout 10m;

# ── Per-port server blocks (generated by scripts/gen-stream-ports.sh) ───────
# External ports 20000–21000 (TLS) → internal ports 30000–31000 (plaintext pods).
# Regenerate after any port-range change:
#   sudo bash scripts/gen-stream-ports.sh
#   sudo nginx -t && sudo systemctl reload nginx
include /etc/nginx/stream-conf.d/gameserver-ports.conf;

